{% extends 'core/base.html' %}
{% load static %}
{% block title %}Main{% endblock %}
{% block content %}

<h1>IELTS Test</h1>
<div class="test">
    <p>Here will be some content:</p>

    <div class="accordion">

        <div class="accordion-item">
            <button class="accordion-header" onclick="toggleAccordion(this)">
                <span>Listening</span>
                <span class="accordion-arrow">&#9660;</span>
            </button>
            <div class="accordion-body">
                <video controls class="video-container">
                    <source src="{% static 'core/videos/listening.mp4' %}" type="video/mp4">
                </video>
                <a href="listening" class="section-link">Go to Listening</a>
            </div>
        </div>

        <div class="accordion-item">
            <button class="accordion-header" onclick="toggleAccordion(this)">
                <span>Reading</span>
                <span class="accordion-arrow">&#9660;</span>
            </button>
            <div class="accordion-body">
                <video controls class="video-container">
                    <source src="{% static 'core/videos/reading.mp4' %}" type="video/mp4">
                </video>
                <a href="reading" class="section-link">Go to Reading</a>
            </div>
        </div>

        <div class="accordion-item">
            <button class="accordion-header" onclick="toggleAccordion(this)">
                <span>Writing</span>
                <span class="accordion-arrow">&#9660;</span>
            </button>
            <div class="accordion-body">
                <video controls class="video-container">
                    <source src="{% static 'core/videos/writing.mp4' %}" type="video/mp4">
                </video>
                <a href="#" class="section-link">Go to Writing</a>
            </div>
        </div>

    </div>
</div>

{% endblock %}
