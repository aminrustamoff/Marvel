{% extends 'core/base.html' %}
{% load static %}
{% block title %}Main{% endblock %}
{% block content %}


<div class="test">
    <div class="accordion">

        <div class="accordion-item" style="margin-top:100px;">
            <button class="accordion-header" onclick="toggleAccordion(this)">
                <span>Listening</span>
                <span class="accordion-arrow"><img class="arrow"src="{% static 'core/icons/arrow-down.svg' %}" alt="Arrow"></span>
            </button>
            <div class="accordion-body">
                <video controls class="video-container">
                    <source src="{% static 'core/videos/listening.mp4' %}" type="video/mp4">
                </video>
                <a href="listening/1" class="section-link">Go to Listening</a>
            </div>
        </div>

        <div class="accordion-item">
            <button class="accordion-header" onclick="toggleAccordion(this)">
                <span>Reading</span>
                <span class="accordion-arrow"><img class="arrow" src="{% static 'core/icons/arrow-down.svg' %}" alt="Arrow"></span>
            </button>
            <div class="accordion-body">
                <video controls class="video-container">
                    <source src="{% static 'core/videos/reading.mp4' %}" type="video/mp4">
                </video>
                <a href="reading" class="section-link">Go to Reading</a>
            </div>
        </div>

        <div class="accordion-item">
            <button class="accordion-header" onclick="toggleAccordion(this)">
                <span>Writing</span>
                <span class="accordion-arrow"><img class="arrow" src="{% static 'core/icons/arrow-down.svg' %}" alt="Arrow"></span>
            </button>
            <div class="accordion-body">
                <video controls class="video-container">
                    <source src="{% static 'core/videos/writing.mp4' %}" type="video/mp4">
                </video>
                <a href="#" class="section-link">Go to Writing</a>
            </div>
        </div>

    </div>
</div>

{% endblock %}
